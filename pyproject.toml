[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws_sso_admin_tools"
version = "1.0.0"
authors = [{name = "Dave Heller", email = "techrules@pm.me"}]
description = "Tools for managing AWS Identity Center"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
keywords = ["aws", "identity-center", "sso", "iam", "administration", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.26.0",
]

[project.scripts]
aws-sso-admin = "aws_sso_admin_tools.main:main"

[project.urls]
"Homepage" = "https://github.com/hellerda/aws-sso-admin-tools/"
"Bug Tracker" = "https://github.com/hellerda/aws-sso-admin-tools/issues"
"Repository" = "https://github.com/hellerda/aws-sso-admin-tools/"

[tool.setuptools.packages.find]
where = ["src"]
